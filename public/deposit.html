<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit - CyberDark Host</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .brand-text {
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .btn-primary {
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
        }
        .btn-primary:hover {
            box-shadow: 0 8px 30px rgba(139, 92, 246, 0.4);
        }
        .btn-login {
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
        }
        .balance-amount-large {
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .quick-amount:hover {
            background: rgba(139, 92, 246, 0.1);
            border-color: #8b5cf6;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <nav class="navbar">
            <div class="nav-brand">
                <span class="brand-icon">🔥</span>
                <span class="brand-text">CyberDark Host</span>
            </div>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/deploy.html">Deploy</a>
                <a href="/wallet.html" class="active">Wallet</a>
                <a href="/login.html" class="btn-login">Login</a>
            </div>
        </nav>

        <section class="wallet-section">
            <div class="wallet-container">
                <h1>💳 Deposit Funds</h1>
                <p class="subtitle">Add money to your wallet using Paystack</p>

                <div class="balance-card">
                    <div class="balance-card-content" style="padding: 10px 0;">
                        <span class="balance-label">Current Balance</span>
                        <span class="balance-amount-large" id="currentBalance">KSH 0.00</span>
                    </div>
                </div>

                <div class="deploy-container" style="max-width: 500px; margin: 0 auto;">
                    <form id="depositForm" class="deploy-form">
                        <div class="form-group">
                            <label for="depositAmount">Amount (KSH)</label>
                            <input type="number" id="depositAmount" placeholder="Enter amount" min="100" required>
                            <small>Minimum deposit: KSH 100</small>
                        </div>

                        <div class="quick-amounts" style="display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0;">
                            <button type="button" class="quick-amount" onclick="setAmount(100)">KSH 100</button>
                            <button type="button" class="quick-amount" onclick="setAmount(500)">KSH 500</button>
                            <button type="button" class="quick-amount" onclick="setAmount(1000)">KSH 1,000</button>
                            <button type="button" class="quick-amount" onclick="setAmount(2000)">KSH 2,000</button>
                            <button type="button" class="quick-amount" onclick="setAmount(5000)">KSH 5,000</button>
                            <button type="button" class="quick-amount" onclick="setAmount(10000)">KSH 10,000</button>
                        </div>

                        <button type="submit" class="btn-primary btn-block" id="depositBtn">
                            💳 Pay with Paystack
                        </button>
                    </form>

                    <div id="depositResult" class="deployment-result"></div>

                    <div style="margin-top: 24px; text-align: center;">
                        <a href="/wallet.html" class="btn-secondary">← Back to Wallet</a>
                    </div>
                </div>
            </div>
        </section>

        <footer class="footer">
            <p>🔥 CyberDark Host &copy; 2026. Built with ❤️ for the developer community.</p>
        </footer>
    </div>

    <script src="script.js"></script>
    <script>
        const currentUser = getCurrentUser();
        
        if (!isLoggedIn()) {
            window.location.href = '/login.html';
        }

        document.querySelector('.btn-login').textContent = currentUser.email.split('@')[0];

        function formatKSH(amount) {
            return `KSH ${Number(amount).toLocaleString()}`;
        }

        async function loadBalance() {
            try {
                const data = await fetchWalletBalance(currentUser.email);
                if (data.success) {
                    document.getElementById('currentBalance').textContent = formatKSH(data.walletBalance);
                }
            } catch (error) {
                console.error('Error loading balance:', error);
            }
        }

        function setAmount(amount) {
            document.getElementById('depositAmount').value = amount;
        }

        document.getElementById('depositForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const amount = parseInt(document.getElementById('depositAmount').value);
            const depositBtn = document.getElementById('depositBtn');
            const resultDiv = document.getElementById('depositResult');

            if (!amount || amount < 100) {
                showResult('Please enter a valid amount (min: KSH 100)', 'error');
                return;
            }

            depositBtn.disabled = true;
            depositBtn.textContent = '⏳ Processing...';
            resultDiv.style.display = 'none';

            try {
                const response = await fetch('/api/deposit/initialize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: currentUser.email,
                        amount: amount,
                        userId: currentUser.email
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showResult('✅ Redirecting to Paystack...', 'success');
                    setTimeout(() => {
                        window.location.href = data.authorization_url;
                    }, 1500);
                } else {
                    showResult(`❌ ${data.error}`, 'error');
                }
            } catch (error) {
                showResult(`❌ Error: ${error.message}`, 'error');
            } finally {
                depositBtn.disabled = false;
                depositBtn.textContent = '💳 Pay with Paystack';
            }
        });

        function showResult(message, type) {
            const resultDiv = document.getElementById('depositResult');
            resultDiv.className = `deployment-result ${type}`;
            resultDiv.innerHTML = message;
            resultDiv.style.display = 'block';
        }

        loadBalance();
    </script>
</body>
</html>
