<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet - CyberDark Host</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            background: #08090d;
            color: #ecedf0;
        }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 30px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #ecedf0;
        }
        .brand-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #fff;
        }
        .brand-text {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #8b5cf6, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .back-link { color: #6b7280; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: #8b5cf6; }

        .balance-card {
            background: #0f1117;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 24px;
            text-align: center;
        }
        .balance-label { color: #6b7280; font-size: 14px; }
        .balance-amount {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 48px;
            font-weight: 700;
            margin: 8px 0;
            background: linear-gradient(135deg, #8b5cf6, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .balance-stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 16px;
        }
        .balance-stats .stat { text-align: center; }
        .balance-stats .stat span:first-child {
            display: block;
            color: #6b7280;
            font-size: 11px;
        }
        .balance-stats .stat span:last-child {
            font-weight: 600;
            font-size: 16px;
        }

        .section {
            background: #0f1117;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .transaction-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .transaction-item:last-child { border-bottom: none; }
        .transaction-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-size: 14px;
        }
        .transaction-details { flex: 1; }
        .transaction-type { font-weight: 500; font-size: 14px; }
        .transaction-desc { font-size: 12px; color: #6b7280; }
        .transaction-date { font-size: 11px; color: #6b7280; }
        .transaction-amount { font-weight: 600; font-size: 15px; }
        .transaction-amount.positive { color: #4ade80; }
        .transaction-amount.negative { color: #f87171; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all .15s ease;
            font-family: inherit;
            text-decoration: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: #fff;
        }
        .btn-primary:hover { transform: translateY(-2px); }
        .btn-ghost {
            background: rgba(255,255,255,0.05);
            color: #ecedf0;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .btn-ghost:hover { background: rgba(255,255,255,0.1); }
        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
        }
        .btn-block { width: 100%; justify-content: center; padding: 14px; }

        .empty-state {
            text-align: center;
            padding: 30px 0;
            color: #6b7280;
        }
        .empty-state i { font-size: 32px; margin-bottom: 12px; display: block; }

        .deployment-item {
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .deployment-item:last-child { border-bottom: none; }
        .deployment-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .deployment-name { font-weight: 500; }
        .deployment-status {
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
            text-transform: capitalize;
        }
        .status-pending { background: rgba(245,158,11,0.1); color: #fbbf24; }
        .status-building { background: rgba(139,92,246,0.1); color: #a78bfa; }
        .status-deployed { background: rgba(16,185,129,0.1); color: #4ade80; }
        .status-failed { background: rgba(239,68,68,0.1); color: #f87171; }
        .deployment-details {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: #6b7280;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .deployment-details a { color: #8b5cf6; text-decoration: none; }
        .deployment-details a:hover { text-decoration: underline; }

        @media (max-width: 640px) {
            .balance-amount { font-size: 32px; }
            .balance-stats { gap: 20px; }
            .container { padding: 12px; }
            .auth-card { padding: 24px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/" class="brand">
                <div class="brand-icon"><i class="fas fa-fire"></i></div>
                <span class="brand-text">CyberDark Host</span>
            </a>
            <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Back</a>
        </div>

        <!-- Balance Card -->
        <div class="balance-card">
            <span class="balance-label">💰 Wallet Balance</span>
            <div class="balance-amount" id="walletBalance">KSH 0</div>
            <div class="balance-stats">
                <div class="stat">
                    <span>Total Deposits</span>
                    <span id="totalDeposits">KSH 0</span>
                </div>
                <div class="stat">
                    <span>Total Spent</span>
                    <span id="totalSpent">KSH 0</span>
                </div>
                <div class="stat">
                    <span>Deployments</span>
                    <span id="deploymentCount">0</span>
                </div>
            </div>
            <div style="margin-top: 20px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
                <button onclick="window.location.href='/?openTopUp=true'" class="btn btn-success">💰 Deposit Funds</button>
                <button onclick="window.location.href='/'" class="btn btn-primary">🚀 Deploy Now</button>
            </div>
        </div>

        <!-- Transactions -->
        <div class="section">
            <div class="section-title"><i class="fas fa-clock-rotate-left" style="margin-right: 8px; color:#8b5cf6;"></i>Transaction History</div>
            <div id="transactionsList">
                <div class="empty-state"><i class="fas fa-spinner fa-spin"></i>Loading transactions...</div>
            </div>
        </div>

        <!-- Deployments -->
        <div class="section">
            <div class="section-title"><i class="fas fa-rocket" style="margin-right: 8px; color:#8b5cf6;"></i>Your Deployments</div>
            <div id="deploymentsList">
                <div class="empty-state"><i class="fas fa-spinner fa-spin"></i>Loading deployments...</div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/login.html';

        function formatKSH(amount) {
            return `KSH ${Number(amount).toLocaleString()}`;
        }

        async function apiGet(path) {
            const res = await fetch(path, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!res.ok) throw new Error(`API error: ${res.status}`);
            return res.json();
        }

        async function loadWallet() {
            try {
                const user = await apiGet('/api/profile');
                const data = user.user || user;
                document.getElementById('walletBalance').textContent = formatKSH(data.walletBalance || 0);
                document.getElementById('totalDeposits').textContent = formatKSH(data.totalDeposits || 0);
                document.getElementById('totalSpent').textContent = formatKSH(data.totalSpent || 0);
                document.getElementById('deploymentCount').textContent = data.deployments?.length || 0;
            } catch (err) {
                console.error('Error loading wallet:', err);
            }
        }

        async function loadTransactions() {
            const container = document.getElementById('transactionsList');
            try {
                const data = await apiGet(`/api/transactions/${encodeURIComponent(currentUser?.email || '')}`);
                const transactions = data.transactions || [];
                if (!transactions.length) {
                    container.innerHTML = `<div class="empty-state"><i class="fas fa-receipt"></i>No transactions yet</div>`;
                    return;
                }
                container.innerHTML = transactions.map(t => `
                    <div class="transaction-item">
                        <div class="transaction-icon" style="background:${t.type === 'deposit' ? 'rgba(16,185,129,0.12)' : 'rgba(139,92,246,0.12)'}; color:${t.type === 'deposit' ? '#4ade80' : '#a78bfa'}">
                            <i class="fas fa-${t.type === 'deposit' ? 'arrow-down' : 'rocket'}"></i>
                        </div>
                        <div class="transaction-details">
                            <div class="transaction-type">${t.type === 'deposit' ? 'Deposit' : 'Deployment'}</div>
                            <div class="transaction-desc">${t.description || ''}</div>
                            <div class="transaction-date">${new Date(t.date).toLocaleString()}</div>
                        </div>
                        <div class="transaction-amount ${t.type === 'deposit' ? 'positive' : 'negative'}">
                            ${t.type === 'deposit' ? '+' : '-'}${formatKSH(t.amount || 0)}
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Error loading transactions:', err);
                container.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i>Failed to load transactions</div>`;
            }
        }

        async function loadDeployments() {
            const container = document.getElementById('deploymentsList');
            try {
                const data = await apiGet(`/api/deployments/${encodeURIComponent(currentUser?.email || '')}`);
                const deployments = data.deployments || [];
                if (!deployments.length) {
                    container.innerHTML = `<div class="empty-state"><i class="fas fa-rocket"></i>No deployments yet</div>`;
                    return;
                }
                container.innerHTML = deployments.map(d => `
                    <div class="deployment-item">
                        <div class="deployment-info">
                            <span class="deployment-name">📱 ${d.appName}</span>
                            <span class="deployment-status status-${d.status}">${d.status}</span>
                        </div>
                        <div class="deployment-details">
                            <span>💰 ${formatKSH(d.amountPaid || 0)}</span>
                            <span>📅 ${new Date(d.createdAt).toLocaleDateString()}</span>
                            ${d.appUrl ? `<a href="${d.appUrl}" target="_blank">🔗 View App</a>` : ''}
                            ${d.id ? `<a href="/logs/${d.id}" target="_blank">📋 Logs</a>` : ''}
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Error loading deployments:', err);
                container.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i>Failed to load deployments</div>`;
            }
        }

        // Get current user email
        let currentUser = null;
        async function init() {
            try {
                const user = await apiGet('/api/profile');
                currentUser = user.user || user;
                await loadWallet();
                await loadTransactions();
                await loadDeployments();
            } catch (err) {
                console.error('Init error:', err);
            }
        }

        init();
    </script>
</body>
</html>
