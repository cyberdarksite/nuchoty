<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404-XMD | Wallet</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            background: #0a0a0f;
            color: #f0edff;
        }
        body::before {
            content: '';
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(109, 40, 217, 0.08) 0%, transparent 70%);
            top: -200px;
            right: -200px;
            pointer-events: none;
            z-index: 0;
        }

        .container { 
            max-width: 900px; 
            margin: 0 auto; 
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(139, 92, 246, 0.08);
            margin-bottom: 30px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #f0edff;
        }
        .brand-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #6d28d9, #ec4899);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 800;
            color: #fff;
            box-shadow: 0 8px 24px -8px rgba(109, 40, 217, 0.4);
        }
        .brand-text {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .back-link { 
            color: #6b5f85; 
            text-decoration: none; 
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .back-link:hover { color: #8b5cf6; }

        /* Balance Card */
        .balance-card {
            background: #14141f;
            border: 1px solid rgba(139, 92, 246, 0.12);
            border-radius: 24px;
            padding: 40px;
            margin-bottom: 28px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .balance-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #6d28d9, #ec4899, #6d28d9);
            background-size: 200% 100%;
            animation: shimmer 3s linear infinite;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .balance-label { 
            color: #6b5f85; 
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .balance-amount {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 52px;
            font-weight: 700;
            margin: 8px 0;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
        }
        .balance-stats {
            display: flex;
            justify-content: center;
            gap: 48px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(139, 92, 246, 0.08);
        }
        .balance-stats .stat { text-align: center; }
        .balance-stats .stat span:first-child {
            display: block;
            color: #6b5f85;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .balance-stats .stat span:last-child {
            font-weight: 600;
            font-size: 18px;
            font-family: 'Space Grotesk', sans-serif;
            color: #f0edff;
        }

        .balance-actions {
            margin-top: 24px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
            text-decoration: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #6d28d9, #7c3aed);
            color: #fff;
            box-shadow: 0 4px 20px -8px rgba(109, 40, 217, 0.4);
        }
        .btn-primary:hover { 
            transform: translateY(-2px);
            box-shadow: 0 8px 30px -8px rgba(109, 40, 217, 0.5);
        }
        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            box-shadow: 0 4px 20px -8px rgba(16, 185, 129, 0.4);
        }
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px -8px rgba(16, 185, 129, 0.5);
        }
        .btn-secondary {
            background: rgba(139, 92, 246, 0.08);
            color: #f0edff;
            border: 1px solid rgba(139, 92, 246, 0.12);
        }
        .btn-secondary:hover {
            background: rgba(139, 92, 246, 0.15);
            border-color: rgba(139, 92, 246, 0.2);
        }

        /* Sections */
        .section {
            background: #14141f;
            border: 1px solid rgba(139, 92, 246, 0.08);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #f0edff;
        }
        .section-title i {
            color: #8b5cf6;
            font-size: 18px;
        }

        /* Transactions */
        .transaction-item {
            display: flex;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid rgba(139, 92, 246, 0.06);
        }
        .transaction-item:last-child { border-bottom: none; }
        .transaction-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 14px;
            font-size: 16px;
            flex-shrink: 0;
        }
        .transaction-details { flex: 1; min-width: 0; }
        .transaction-type { 
            font-weight: 600; 
            font-size: 14px;
            color: #f0edff;
        }
        .transaction-desc { 
            font-size: 12px; 
            color: #6b5f85;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .transaction-date { 
            font-size: 11px; 
            color: #6b5f85;
            margin-top: 2px;
        }
        .transaction-amount { 
            font-weight: 700; 
            font-size: 16px;
            font-family: 'Space Grotesk', sans-serif;
            flex-shrink: 0;
            margin-left: 12px;
        }
        .transaction-amount.positive { color: #4ade80; }
        .transaction-amount.negative { color: #f87171; }

        /* Deployments */
        .deployment-item {
            padding: 14px 0;
            border-bottom: 1px solid rgba(139, 92, 246, 0.06);
        }
        .deployment-item:last-child { border-bottom: none; }
        .deployment-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .deployment-name { 
            font-weight: 600;
            font-size: 14px;
            color: #f0edff;
        }
        .deployment-status {
            padding: 3px 14px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .status-pending { background: rgba(245,158,11,0.12); color: #fbbf24; }
        .status-building { background: rgba(139,92,246,0.12); color: #a78bfa; }
        .status-deployed { background: rgba(16,185,129,0.12); color: #4ade80; }
        .status-failed { background: rgba(239,68,68,0.12); color: #f87171; }
        .deployment-details {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: #6b5f85;
            flex-wrap: wrap;
            margin-top: 6px;
        }
        .deployment-details a { 
            color: #8b5cf6; 
            text-decoration: none;
            font-weight: 500;
        }
        .deployment-details a:hover { text-decoration: underline; }

        /* Empty States */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #6b5f85;
        }
        .empty-state i { 
            font-size: 40px; 
            margin-bottom: 16px; 
            display: block;
            opacity: 0.4;
            color: #8b5cf6;
        }
        .empty-state h4 {
            color: #f0edff;
            font-size: 16px;
            margin-bottom: 4px;
        }
        .empty-state p {
            font-size: 13px;
            color: #6b5f85;
        }

        /* Toast */
        .toast-notification {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 24px;
            border-radius: 12px;
            z-index: 999;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            animation: slideUp 0.3s ease;
            font-family: 'Inter', sans-serif;
            max-width: 90%;
        }
        @keyframes slideUp {
            from { transform: translateX(-50%) translateY(20px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }

        @media (max-width: 640px) {
            .container { padding: 12px; }
            .balance-card { padding: 24px; }
            .balance-amount { font-size: 36px; }
            .balance-stats { gap: 24px; }
            .balance-stats .stat span:last-child { font-size: 15px; }
            .header { flex-wrap: wrap; gap: 12px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <a href="/" class="brand">
                <div class="brand-icon">404</div>
                <span class="brand-text">404-XMD</span>
            </a>
            <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        </div>

        <!-- Balance Card -->
        <div class="balance-card">
            <span class="balance-label"><i class="fas fa-wallet" style="margin-right:6px;"></i> Wallet Balance</span>
            <div class="balance-amount" id="walletBalance">KSH 0</div>
            <div class="balance-stats">
                <div class="stat">
                    <span>Total Deposits</span>
                    <span id="totalDeposits">KSH 0</span>
                </div>
                <div class="stat">
                    <span>Total Spent</span>
                    <span id="totalSpent">KSH 0</span>
                </div>
                <div class="stat">
                    <span>Bots Deployed</span>
                    <span id="deploymentCount">0</span>
                </div>
            </div>
            <div class="balance-actions">
                <button onclick="window.location.href='/?openTopUp=true'" class="btn btn-success">
                    <i class="fas fa-plus-circle"></i> Add Funds
                </button>
                <button onclick="window.location.href='/'" class="btn btn-primary">
                    <i class="fas fa-rocket"></i> Deploy Bot
                </button>
            </div>
        </div>

        <!-- Transactions -->
        <div class="section">
            <div class="section-title">
                <i class="fas fa-clock-rotate-left"></i> Transaction History
            </div>
            <div id="transactionsList">
                <div class="empty-state">
                    <i class="fas fa-spinner fa-pulse"></i>
                    <h4>Loading transactions...</h4>
                </div>
            </div>
        </div>

        <!-- Deployments -->
        <div class="section">
            <div class="section-title">
                <i class="fas fa-robot"></i> Your Deployed Bots
            </div>
            <div id="deploymentsList">
                <div class="empty-state">
                    <i class="fas fa-spinner fa-pulse"></i>
                    <h4>Loading deployments...</h4>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/login.html';

        let currentUser = null;

        function formatKSH(amount) {
            return `KSH ${Number(amount).toLocaleString()}`;
        }

        function showToast(message, type = 'info') {
            const existing = document.querySelector('.toast-notification');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'toast-notification';
            const colors = {
                success: '#10b981',
                error: '#ef4444',
                info: '#8b5cf6'
            };
            toast.style.cssText = `
                background: #14141f;
                border: 1px solid rgba(139, 92, 246, 0.2);
                color: ${colors[type] || '#a78bfa'};
                font-size: 14px;
                font-weight: 500;
            `;
            toast.innerHTML = `<i class="fas ${type === 'info' ? 'fa-info-circle' : type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}" style="margin-right:10px;"></i> ${message}`;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(-50%) translateY(10px)';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        async function apiGet(path) {
            const res = await fetch(path, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!res.ok) throw new Error(`API error: ${res.status}`);
            return res.json();
        }

        async function loadWallet() {
            try {
                const user = await apiGet('/api/profile');
                currentUser = user.user || user;
                document.getElementById('walletBalance').textContent = formatKSH(currentUser.walletBalance || 0);
                document.getElementById('totalDeposits').textContent = formatKSH(currentUser.totalDeposits || 0);
                document.getElementById('totalSpent').textContent = formatKSH(currentUser.totalSpent || 0);
                document.getElementById('deploymentCount').textContent = currentUser.deployments?.length || 0;
            } catch (err) {
                console.error('Error loading wallet:', err);
                showToast('Failed to load wallet data', 'error');
            }
        }

        async function loadTransactions() {
            const container = document.getElementById('transactionsList');
            try {
                if (!currentUser?.email) {
                    container.innerHTML = `<div class="empty-state"><i class="fas fa-receipt"></i><h4>No transactions</h4><p>Your transactions will appear here</p></div>`;
                    return;
                }
                const data = await apiGet(`/api/transactions/${encodeURIComponent(currentUser.email)}`);
                const transactions = data.transactions || [];
                
                if (!transactions.length) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-receipt"></i>
                            <h4>No transactions yet</h4>
                            <p>Deposit funds to get started</p>
                        </div>
                    `;
                    return;
                }
                
                container.innerHTML = transactions.map(t => `
                    <div class="transaction-item">
                        <div class="transaction-icon" style="background:${t.type === 'deposit' ? 'rgba(16,185,129,0.12)' : 'rgba(139,92,246,0.12)'}; color:${t.type === 'deposit' ? '#4ade80' : '#a78bfa'}">
                            <i class="fas fa-${t.type === 'deposit' ? 'arrow-down' : 'rocket'}"></i>
                        </div>
                        <div class="transaction-details">
                            <div class="transaction-type">${t.type === 'deposit' ? '💰 Deposit' : '🚀 Bot Deployment'}</div>
                            <div class="transaction-desc">${t.description || ''}</div>
                            <div class="transaction-date">${new Date(t.date).toLocaleString()}</div>
                        </div>
                        <div class="transaction-amount ${t.type === 'deposit' ? 'positive' : 'negative'}">
                            ${t.type === 'deposit' ? '+' : '-'}${formatKSH(t.amount || 0)}
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Error loading transactions:', err);
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h4>Failed to load</h4>
                        <p>Could not load transaction history</p>
                    </div>
                `;
            }
        }

        async function loadDeployments() {
            const container = document.getElementById('deploymentsList');
            try {
                if (!currentUser?.email) {
                    container.innerHTML = `<div class="empty-state"><i class="fas fa-robot"></i><h4>No bots deployed</h4><p>Deploy your first bot today</p></div>`;
                    return;
                }
                const data = await apiGet(`/api/deployments/${encodeURIComponent(currentUser.email)}`);
                const deployments = data.deployments || [];
                
                if (!deployments.length) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-robot"></i>
                            <h4>No bots deployed</h4>
                            <p>Deploy your first Discord bot with 404-XMD</p>
                            <a href="/" class="btn btn-primary" style="margin-top:12px;display:inline-flex;">
                                <i class="fas fa-rocket"></i> Deploy Now
                            </a>
                        </div>
                    `;
                    return;
                }
                
                container.innerHTML = deployments.map(d => `
                    <div class="deployment-item">
                        <div class="deployment-info">
                            <span class="deployment-name">🤖 ${d.appName}</span>
                            <span class="deployment-status status-${d.status}">${d.status}</span>
                        </div>
                        <div class="deployment-details">
                            <span>💰 ${formatKSH(d.amountPaid || 0)}</span>
                            <span>📅 ${new Date(d.createdAt).toLocaleDateString()}</span>
                            ${d.appUrl ? `<a href="${d.appUrl}" target="_blank">🔗 View Bot</a>` : ''}
                            ${d.id ? `<a href="/logs/${d.id}" target="_blank">📋 Logs</a>` : ''}
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Error loading deployments:', err);
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h4>Failed to load</h4>
                        <p>Could not load your deployments</p>
                    </div>
                `;
            }
        }

        async function init() {
            await loadWallet();
            await loadTransactions();
            await loadDeployments();
        }

        init();

        // Check for deposit success/failure from URL params
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('status') === 'success') {
            const amount = urlParams.get('amount');
            showToast(`✅ Deposit of ${formatKSH(amount || '')} successful!`, 'success');
            // Refresh wallet
            setTimeout(init, 1000);
        } else if (urlParams.get('status') === 'failed') {
            showToast('❌ Deposit failed. Please try again.', 'error');
        } else if (urlParams.get('status') === 'error') {
            showToast('❌ An error occurred during payment verification.', 'error');
        }
    </script>
</body>
</html>
