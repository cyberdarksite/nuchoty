<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CyberDark Host</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .brand-text {
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .btn-primary {
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
        }
        .btn-primary:hover {
            box-shadow: 0 8px 30px rgba(139, 92, 246, 0.4);
        }
        .auth-links a {
            color: #8b5cf6;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <span class="auth-icon">🔥</span>
                <h2 style="background: linear-gradient(135deg, #8b5cf6, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">CyberDark Host</h2>
                <p>Welcome back! Login to deploy your bots</p>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn-primary btn-block">Login</button>

                <div class="auth-links">
                    <a href="#" onclick="loginWithGoogle()">Login with Google</a>
                    <span>|</span>
                    <a href="/register.html">Create Account</a>
                </div>

                <div id="loginMessage" class="message"></div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showMessage('Please fill in all fields', 'error');
                return;
            }

            const users = JSON.parse(localStorage.getItem('users') || '[]');
            const user = users.find(u => u.email === email && u.password === password);

            if (user) {
                localStorage.setItem('currentUser', JSON.stringify(user));
                showMessage('✅ Login successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = '/deploy.html';
                }, 1000);
            } else {
                showMessage('❌ Invalid email or password', 'error');
            }
        });

        function loginWithGoogle() {
            showMessage('Google login coming soon!', 'info');
        }

        function showMessage(message, type) {
            const msgDiv = document.getElementById('loginMessage');
            msgDiv.textContent = message;
            msgDiv.className = `message ${type}`;
            msgDiv.style.display = 'block';
            
            setTimeout(() => {
                msgDiv.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
